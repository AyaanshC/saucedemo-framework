[pytest]
testpaths = tests
addopts = -ra --strict-markers --html=reports/functional.html --self-contained-html --junitxml=reports/junit.xml
markers =
    smoke: core demonstration flows
    regression: complete functional coverage including negative and boundary cases
    requirement(id): case study requirement identifier
log_file = reports/logs/execution.log
log_file_level = INFO
log_file_format = %(asctime)s %(levelname)s %(name)s %(message)s
log_cli = true
log_cli_level = INFO
