[pytest]
testpaths = tests
addopts = -ra --strict-markers -m case_study --html=reports/functional.html --self-contained-html --junitxml=reports/junit.xml
markers =
    smoke: core demonstration flows
    regression: full functional regression suite including negative and boundary cases
    extended: additional app coverage beyond the original 25 case-study tests
    proposed_contract: proposed edge-case acceptance rules requiring product-owner agreement
    case_study: original 25 cases implementing the PDF's functional scope with the prescribed valid account
    coverage_limited: observable check with a documented limitation on proving the underlying rule
    requirement(id): original FR identifier or extended APP-area traceability label
log_file = reports/logs/execution.log
log_file_level = INFO
log_file_format = %(asctime)s %(levelname)s %(name)s %(message)s
log_cli = true
log_cli_level = INFO
